<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
    p {
        font-family: verdana, arial, helvetica, sans-serif;
        font-size: 2em;
    }

    span {
        font-size: 2em;
        color: red
    }

    body {
        background-color: #9cf5ff;
    }

    ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    li {
        margin: 0;
        padding: 0;
        font-family: verdana;
    }

    li a {
        display: block;
        text-decoration: none;
        padding: 2px 5px 2px 5px;
    <!-- top, right, left, bottom --> border-top: 1px solid #FFF;
        border-right: 1px solid #FEB660;
        border-bottom: 1px solid #FEB660;
        border-left: 1px solid #FFF;
        width: 100px;
    }

    li a:link, li a:visited {
        background: #F2C793;
        color: #E47C00;
        font-weight: bold;
    }

    li a:hover, li a:active {
        background: #E47C00;
        color: #FFF;
        font-weight: bold;
    }

    li li a:link, li li a:visited {
        background: #F9E5CD;
        color: #E47C00;
        font-weight: normal;
    }

    li li a:hover, li li a:active {
        background: #E47C00;
        color: #FFF;
        font-weight: normal;
    }

    ul ul {
        margin: 0 0 0 25px;
    }





    div#box1{
        background-color: lightgray;
        width: 100%;
        height: 75px;
        text-align: center;
    }
    div#box2{
        background-color: #ff9349;
        float: left;
        width: 15%;
        height: 200px;
        text-align: center;
    }
    div#box3{
        background-color: lightgreen;
        float: left;
        width: 70%;
        height: 200px;
        text-align: center;
        vertical-align: middle;
    }
    div#box4{
        background-color: lightcoral;
        float: left;
        width: 15%;
        height: 200px;
        text-align: center;
    }
</style>
<body>

<p>Geneste <span>elementen</span> kunnen voor onverwachte verrassingen zorgen.</p>
<br>
<ul>
    <li><a href="#">item 1</a>
        <ul>
            <li><a href="#">subitem
                1.1</a></li>
            <li><a href="#">subitem
                1.2</a></li>
            <li><a href="#">subitem
                1.3</a></li>
            <li><a href="#">subitem
                1.4</a></li>
        </ul>
    </li>
    <li><a href="#">item 2</a></li>
    <li><a href="#">item 3</a>
        <ul>
            <li><a href="#">subitem
                3.1</a></li>
            <li><a href="#">subitem
                3.2</a></li>
            <li><a href="#">subitem
                3.3</a></li>
            <li><a href="#">subitem
                3.4</a></li>
        </ul>
    </li>
    <li><a href="#">item 4</a></li>

</ul>


<br>
<br>


<div id="box1">blok 1</div>
<div id="box2">blok 2</div>
<div id="box3">blok 3</div>

</ul>

</html>
