<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Internet Start Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">

    <link rel="stylesheet" href="../styles/index.css">
</head>

<body>

<div class="container py-5">

    <h1>My Internet Start Page</h1>

    <div class="mb-3">
        <label class="form-label">Zoekopdracht</label>
        <input id="input" class="form-control" placeholder="Enter commando">
        <small class="text-muted">Start your commando with "/[character] [zoekopdracht]"</small>
    </div>

    <button id="btn" class="btn w-100 mb-4">GO!</button>

    <h2 class="mb-3">History</h2>

    <div id="swatches" class="row g-3"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

<script src="../scripts/index.js"></script>
</body>
</html>
